name: CI

on:
  push:
    branches: [ "main", "master", "v4-meta-adapter" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Opt into Node.js 24 now

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: twinai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tesseract-ocr libpq-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/twinai_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          SECRET_KEY: "test-secret-key-that-is-at-least-32-chars"
          NVIDIA_API_KEY: "dummy-key"
          META_ACCESS_TOKEN: "dummy-token"
          GEMINI_API_KEY: "dummy-key"
          LLM_PROVIDER: "gemini"
          APP_ENV: "test"
        run: |
          export PYTHONPATH=$(pwd)/backend
          pytest backend/tests/ -v

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check backend/ --ignore E501
