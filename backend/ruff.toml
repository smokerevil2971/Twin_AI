[lint]
# Ignore rules that conflict with our deliberate patterns:
#   E712 — SQLAlchemy requires explicit `== True` / `== False` for correct SQL generation
#   E402 — Some files have intentional mid-file imports (Sentry init, lazy imports)
#   E401 — Inline imports acceptable in some helper functions
ignore = ["E712", "E402", "E401"]

# Per-file ignores:
#   __init__.py  — Side-effect imports are intentional (module self-registration pattern)
#   migrations/  — Auto-generated by Alembic; we don't lint these
[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/migrations/**" = ["F401", "E501"]
"**/tests/**" = ["F401"]
